[package]
name = "smodeltrans"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smodeltrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cuda", "flash-attn"]
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
flash-attn = ["cuda", "candle-flash-attn"]

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0", optional = true }
anyhow = "=1.0.104"
base64 = "0.22"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ab_glyph = "=0.2.32"
fontdb = "=0.23.0"
unicode-segmentation = "=1.13.3"
imageproc = "=0.26.2"
tokenizers = "=0.22.2"
toml = "=0.8.23"
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }


