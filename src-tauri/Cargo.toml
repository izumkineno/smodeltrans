[package]
name = "smodeltrans"
version = "0.4.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smodeltrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cuda", "flash-attn"]
cuda = ["candle-core/cuda"]
flash-attn = ["cuda", "candle-flash-attn", "candle-transformers/cuda"]

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "31f35b147389700ed2a178ee66a91c3cc25cc80d", version = "=0.11.0", optional = true }
anyhow = "=1.0.104"
base64 = "0.23.1"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ab_glyph = "=0.2.32"
fontdb = "=0.23.0"
unicode-segmentation = "=1.13.3"
imageproc = { version = "=0.26.2", default-features = false, features = ["text"] }
tokenizers = "=0.22.2"
toml = "=0.8.23"
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.3.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-mcp-bridge = "0.10"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "fs", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
simple_downloader = { version = "0.5.4", features = ["resume", "progress"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true
lto = false
panic = "unwind"

[profile.dev.package.candle-flash-attn]
opt-level = 2

[profile.dev.package.candle-kernels]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"

[lints.rust]
linker_messages = "allow"
