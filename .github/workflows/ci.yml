name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Build (vue-tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Sync version
        run: bun run sync:version
      - name: Type check + Vite build
        run: bun run build

  rust-check:
    name: Rust Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-check
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check (no CUDA)
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Cargo check (CUDA stub, no flash-attn rebuild)
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features cuda --message-format=short
      - name: Cargo test (no CUDA)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib -- --nocapture

  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-${{ matrix.target }}
          # 避免 candle-flash-attn 清理后重编，保留 sccache/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Sync version
        run: bun run sync:version
      - name: Build frontend
        run: bun run build
      - name: Build Tauri (no-bundle on Linux, bundle on Windows)
        run: |
          bun run tauri build --target ${{ matrix.target }} ${{ matrix.bundle == false && '--no-bundle' || '' }}
        env:
          CI: false
      - name: Upload Tauri bundle (Windows)
        if: matrix.bundle && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smodeltrans-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 7
